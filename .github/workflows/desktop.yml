name: Desktop

on:
  push:
    paths:
      - ".github/workflows/desktop.yml"
      - "Cargo.toml"
      - "crates/**"
      - "apps/desktop/**"
      - "PLAN77.md"
      - "docs/RESTRUCTURE_PLAN.md"
      - "docs/GOOGLE_DOCS_PARITY_TODO.md"
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "Cargo.toml"
      - "crates/**"
      - "apps/desktop/**"
      - "PLAN77.md"
      - "docs/RESTRUCTURE_PLAN.md"
      - "docs/GOOGLE_DOCS_PARITY_TODO.md"

jobs:
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Install desktop npm dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Verify desktop and Rust workspace
        working-directory: apps/desktop
        run: npm run verify

      - name: Check native Tauri backend
        working-directory: apps/desktop
        run: npm run native-check
