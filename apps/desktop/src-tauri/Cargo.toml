[package]
name = "opendoc-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
opendoc-app-api = { path = "../../../crates/opendoc-app-api", features = ["opendal-store"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri = { version = "2.11.5", default-features = false, features = ["wry", "compression", "common-controls-v6", "dynamic-acl", "x11"] }
