[package]
name = "opendoc-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# The contract generator exports the model's own bounds and unit factors to
# TypeScript, so it has to read them from the model rather than restate them.
opendoc-core = { path = "../opendoc-core" }
opendoc-spreadsheet = { path = "../opendoc-spreadsheet" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
