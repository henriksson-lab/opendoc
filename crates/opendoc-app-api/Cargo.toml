[package]
name = "opendoc-app-api"
version = "0.1.0"
edition = "2021"

[dependencies]
opendoc-core = { path = "../opendoc-core" }
opendoc-citations = { path = "../opendoc-citations" }
opendoc-format = { path = "../opendoc-format" }
opendoc-import = { path = "../opendoc-import" }
opendoc-merge = { path = "../opendoc-merge" }
opendoc-sign = { path = "../opendoc-sign" }
opendoc-store = { path = "../opendoc-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
regex = "1"
csv = "1"
base64 = "0.22"
calamine = "0.31"
rust_xlsxwriter = "0.99.0"

[features]
default = []
opendal-store = ["opendoc-store/opendal"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
