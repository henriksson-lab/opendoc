[package]
name = "opendoc-app"
version = "0.1.0"
edition = "2021"
description = "Runtime-facing OpenDoc application facade"

[dependencies]
opendoc-core = { path = "../opendoc-core" }
opendoc-api = { path = "../opendoc-api" }
opendoc-citations = { path = "../opendoc-citations" }
opendoc-format = { path = "../opendoc-format" }
opendoc-import = { path = "../opendoc-import" }
opendoc-merge = { path = "../opendoc-merge" }
opendoc-render = { path = "../opendoc-render" }
opendoc-spreadsheet = { path = "../opendoc-spreadsheet" }
opendoc-sign = { path = "../opendoc-sign" }
opendoc-store = { path = "../opendoc-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"

[features]
default = []
opendal-store = ["opendoc-store/opendal"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
