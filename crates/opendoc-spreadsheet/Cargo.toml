[package]
name = "opendoc-spreadsheet"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
calamine = "0.31"
csv = "1"
rust_xlsxwriter = "0.99.0"
serde = { version = "1", features = ["derive"] }
