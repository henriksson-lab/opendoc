[package]
name = "opendoc-spreadsheet"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
calamine = "0.31"
csv = "1"
rust_xlsxwriter = "0.99.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# Only to pre-flight an `.xlsx` package before `calamine` reads it; the same
# version `calamine` already builds, so this is not a second copy.
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
# `calamine` deliberately exposes values, formulas and merges rather than
# layout metadata.  Read the small worksheet/workbook XML parts separately
# for axis dimensions and visibility while retaining calamine as the value
# parser.
quick-xml = "0.38"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
# `rust_xlsxwriter` reads the system clock for the workbook's creation time,
# which traps on wasm32-unknown-unknown. Its `wasm` feature reads `Date.now()`
# instead, so XLSX export works in the browser shell as well as natively.
rust_xlsxwriter = { version = "0.99.0", features = ["wasm"] }
