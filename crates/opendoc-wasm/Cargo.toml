[package]
name = "opendoc-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings exposing the OpenDoc app API to the browser shell"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
opendoc-app-api = { path = "../opendoc-app-api" }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
