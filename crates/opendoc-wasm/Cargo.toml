[package]
name = "opendoc-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings exposing the OpenDoc app API to the browser shell"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
opendoc-app = { path = "../opendoc-app" }
opendoc-store = { path = "../opendoc-store" }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

# IndexedDB is the browser's only durable local store; these are the bindings
# for it, so the adapter is Rust rather than JavaScript the core has to trust.
[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "DomException",
    "DomStringList",
    "Event",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
]
